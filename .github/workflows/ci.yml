name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: naim_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: naim_pro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U naim_test -d naim_pro_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://naim_test:test-only-password@localhost:5432/naim_pro_ci
      TEST_DATABASE_URL: postgresql://naim_test:test-only-password@localhost:5432/naim_pro_ci
      SESSION_SECRET: ci-only-placeholder-session-secret-with-more-than-forty-eight-characters
      DOCUMENT_STORAGE_DRIVER: local
      APP_ORIGIN: http://127.0.0.1:3000
      E2E_ADMIN_PHONE: "9000000001"
      E2E_ADMIN_PASSWORD: TestOnly-Admin-Password-1!
      E2E_MEMBER_PHONE: "9000000002"
      E2E_MEMBER_PASSWORD: TestOnly-Member-Password-1!
      E2E_VENDOR_PHONE: "9000000003"
      E2E_VENDOR_PASSWORD: TestOnly-Vendor-Password-1!
      E2E_DRIVER_PHONE: "9000000004"
      E2E_DRIVER_PASSWORD: TestOnly-Driver-Password-1!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:check
      - run: pnpm security:secrets
      - run: pnpm test:db:setup
      - run: pnpm test:integration
      - run: pnpm test:e2e:fixtures
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance
        run: |
          pnpm start > /tmp/naim-pro-e2e.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health/ready; then break; fi
            sleep 1
          done
          pnpm test:e2e
      - if: always()
        run: pnpm test:db:teardown
